<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="skyGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="50%" stop-color="#87ceeb"/>
      <stop offset="100%" stop-color="#e0f7fa"/>
    </linearGradient>
    <linearGradient id="groundGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>
    <radialGradient id="sunGradient" cx="85%" cy="15%" r="20%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="cloudBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1920" height="1080" fill="url(#skyGradient1)"/>
  
  <circle cx="1600" cy="150" r="120" fill="url(#sunGradient)" filter="url(#cloudBlur)"/>
  
  <g filter="url(#cloudBlur)" opacity="0.9">
    <ellipse cx="200" cy="120" rx="100" ry="40" fill="white"/>
    <ellipse cx="280" cy="100" rx="80" ry="35" fill="white"/>
    <ellipse cx="340" cy="120" rx="70" ry=30" fill="white"/>
    
    <ellipse cx="600" cy="200" rx="120" ry="45" fill="white" opacity="0.7"/>
    <ellipse cx="700" cy="180" rx="90" ry="40" fill="white" opacity="0.7"/>
    
    <ellipse cx="1200" cy="80" rx="110" ry="35" fill="white" opacity="0.8"/>
    <ellipse cx="1280" cy="60" rx="80" ry="30" fill="white" opacity="0.8"/>
  </g>
  
  <rect x="0" y="900" width="1920" height="180" fill="url(#groundGradient1)"/>
  
  <ellipse cx="400" cy="920" rx="150" ry="30" fill="#795548" opacity="0.5"/>
  <ellipse cx="1520" cy="920" rx="150" ry="30" fill="#795548" opacity="0.5"/>
  <ellipse cx="960" cy="920" rx="100" ry="25" fill="#795548" opacity="0.4"/>
  
  <g fill="#4caf50" opacity="0.6">
    <ellipse cx="100" cy="890" rx="25" ry="15"/>
    <ellipse cx="180" cy="885" rx="20" ry="12"/>
    <ellipse cx="300" cy="890" rx="22" ry="14"/>
    <ellipse cx="1620" cy="890" rx="25" ry="15"/>
    <ellipse cx="1740" cy="885" rx="20" ry="12"/>
    <ellipse cx="860" cy="890" rx="22" ry="14"/>
    <ellipse cx="1060" cy="890" rx="20" ry="12"/>
  </g>
  
  <rect x="400" y="750" width="300" height="40" fill="#6d4c41" rx="4"/>
  <rect x="400" y="750" width="300" height="8" fill="#8d6e63" rx="4"/>
  
  <rect x="1520" y="750" width="300" height="40" fill="#6d4c41" rx="4"/>
  <rect x="1520" y="750" width="300" height="8" fill="#8d6e63" rx="4"/>
  
  <rect x="960" y="500" width="200" height="40" fill="#6d4c41" rx="4"/>
  <rect x="960" y="500" width="200" height="8" fill="#8d6e63" rx="4"/>
</svg>