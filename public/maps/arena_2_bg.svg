<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="skyGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="50%" stop-color="#34495e"/>
      <stop offset="100%" stop-color="#4a6fa5"/>
    </linearGradient>
    <linearGradient id="groundGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5d4e37"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <linearGradient id="windGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="mistBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  
  <rect width="1920" height="1080" fill="url(#skyGradient2)"/>
  
  <g opacity="0.3" filter="url(#mistBlur)">
    <rect x="-200" y="200" width="2320" height="100" fill="url(#windGradient)">
      <animate attributeName="x" from="-200" to="1920" dur="20s" repeatCount="indefinite"/>
    </rect>
    <rect x="-200" y="500" width="2320" height="80" fill="url(#windGradient)">
      <animate attributeName="x" from="-200" to="1920" dur="25s" repeatCount="indefinite"/>
    </rect>
    <rect x="-200" y="800" width="2320" height="60" fill="url(#windGradient)">
      <animate attributeName="x" from="-200" to="1920" dur="18s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <ellipse cx="1700" cy="150" rx="100" ry="80" fill="#78909c" opacity="0.4"/>
  
  <rect x="0" y="900" width="1920" height="180" fill="url(#groundGradient2)"/>
  
  <g fill="#4e342e">
    <path d="M0,900 Q200,800 400,900 T800,900 T1200,900 T1600,900 T2000,900 L1920,1080 L0,1080 Z" opacity="0.8"/>
    <path d="M0,950 Q200,850 400,950 T800,950 T1200,950 T1600,950 T2000,950 L1920,1080 L0,1080 Z" opacity="0.5"/>
  </g>
  
  <rect x="200" y="700" width="250" height="50" fill="#4e342e" rx="6"/>
  <rect x="200" y="700" width="250" height="10" fill="#5d4e37" rx="6"/>
  
  <rect x="1470" y="700" width="250" height="50" fill="#4e342e" rx="6"/>
  <rect x="1470" y="700" width="250" height="10" fill="#5d4e37" rx="6"/>
  
  <rect x="700" y="550" width="180" height="40" fill="#4e342e" rx="6"/>
  <rect x="700" y="550" width="180" height="8" fill="#5d4e37" rx="6"/>
  
  <rect x="1040" y="550" width="180" height="40" fill="#4e342e" rx="6"/>
  <rect x="1040" y="550" width="180" height="8" fill="#5d4e37" rx="6"/>
  
  <rect x="900" y="400" width="120" height="35" fill="#4e342e" rx="6"/>
  <rect x="900" y="400" width="120" height="7" fill="#5d4e37" rx="6"/>
  
  <g fill="#3e2723" opacity="0.7">
    <ellipse cx="500" cy="680" rx="100" ry="20"/>
    <ellipse cx="1420" cy="680" rx="100" ry="20"/>
    <ellipse cx="800" cy="530" rx="70" ry="15"/>
    <ellipse cx="1120" cy="530" rx="70" ry="15"/>
  </g>
</svg>