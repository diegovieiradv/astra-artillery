  <ellipse cx="64" cy="108" rx="28" ry="20" fill="#1e3a5f"/>
  <path d="M48 100 L64 94 L80 100 L80 120 L48 120 Z" fill="#2563eb" stroke="#60a5fa" stroke-width="1"/>
