  <circle cx="64" cy="56" r="24" fill="#fde68a"/>
  <!-- Hair - long flowing -->
  <path d="M40 56 Q36 40 44 30 Q56 22 64 24 Q72 22 84 30 Q92 40 88 56 L86 70 Q84 64 82 58 L82 48 Q76 34 64 32 Q52 34 46 48 L46 58 Q44 64 42 70 Z" fill="#93c5fd"/>
  <path d="M42 56 Q38 42 46 32 Q56 24 64 26 Q72 24 82 32 Q90 42 86 56 L84 66 Q82 60 80 54 L80 46 Q74 34 64 32 Q54 34 48 46 L48 54 Q46 60 44 66 Z" fill="#60a5fa"/>
  <!-- Sniper visor / monocle -->
  <circle cx="74" cy="50" r="10" fill="none" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="74" cy="50" r="7" fill="#0f172a" opacity="0.7"/>
  <circle cx="74" cy="50" r="5" fill="#1e293b"/>
  <!-- Crosshair -->
  <line x1="74" y1="44" x2="74" y2="46" stroke="#60a5fa" stroke-width="1"/>
  <line x1="74" y1="54" x2="74" y2="56" stroke="#60a5fa" stroke-width="1"/>
  <line x1="68" y1="50" x2="70" y2="50" stroke="#60a5fa" stroke-width="1"/>
  <line x1="78" y1="50" x2="80" y2="50" stroke="#60a5fa" stroke-width="1"/>
  <!-- Eye behind visor -->
  <circle cx="74" cy="50" r="2.5" fill="#1e40af"/>
  <circle cx="75" cy="49" r="1" fill="#ffffff"/>
  <!-- Other eye -->
  <ellipse cx="54" cy="50" rx="5" ry="4.5" fill="#ffffff"/>
  <circle cx="55" cy="50" r="2.5" fill="#1e293b"/>
  <circle cx="56" cy="49" r="1" fill="#ffffff"/>
