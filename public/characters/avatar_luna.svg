  <path d="M48 44 L58 42" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
  <path d="M68 42 L82 44" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
  <!-- Determined smile -->
  <path d="M57 60 L64 58 L71 60" stroke="#92400e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Scope glow -->
