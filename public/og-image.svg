<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g opacity="0.06" stroke="#4ade80" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="100" cy="530" r="60" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.15"/>
  <circle cx="1100" cy="100" r="40" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.15"/>
  <circle cx="950" cy="500" r="80" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.1"/>
  <!-- Tank icon -->
  <g transform="translate(540, 180)" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="20" y="40" width="80" height="35" rx="8" fill="rgba(74,222,128,0.1)"/>
    <circle cx="35" cy="85" r="12" fill="rgba(74,222,128,0.1)"/>
    <circle cx="85" cy="85" r="12" fill="rgba(74,222,128,0.1)"/>
    <circle cx="60" cy="85" r="12" fill="rgba(74,222,128,0.1)"/>
    <rect x="45" y="20" width="30" height="20" rx="4" fill="rgba(74,222,128,0.1)"/>
    <line x1="60" y1="20" x2="60" y2="-10"/>
    <circle cx="60" cy="-15" r="5" fill="#4ade80"/>
  </g>
  <!-- Title -->
  <text x="600" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#f1f5f9" letter-spacing="0.05em">ASTRA ARTILLERY</text>
  <!-- Subtitle -->
  <text x="600" y="385" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#94a3b8" letter-spacing="0.15em">ARTILHARIA EM TURNOS 2D</text>
  <!-- Accent line -->
  <rect x="450" y="405" width="300" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>
  <!-- Features -->
  <text x="600" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748b">10 Personagens · 10 Fases · Multiplayer · Ranking</text>
  <!-- URL -->
  <text x="600" y="570" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569" letter-spacing="0.1em">astra-artillery.vercel.app</text>
  <!-- Corner decorations -->
  <path d="M30 30 L80 30 L80 35 L35 35 L35 80 L30 80 Z" fill="#4ade80" opacity="0.4"/>
  <path d="M1170 30 L1120 30 L1120 35 L1165 35 L1165 80 L1170 80 Z" fill="#4ade80" opacity="0.4"/>
  <path d="M30 600 L80 600 L80 595 L35 595 L35 550 L30 550 Z" fill="#4ade80" opacity="0.4"/>
  <path d="M1170 600 L1120 600 L1120 595 L1165 595 L1165 550 L1170 550 Z" fill="#4ade80" opacity="0.4"/>
</svg>
