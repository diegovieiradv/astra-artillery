<svg viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c1a1f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#skyGradient)"/>
  <g opacity="0.3">
    <circle cx="300" cy="200" r="80" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="1200" cy="150" r="40" fill="#fbbf24"/>
    <circle cx="2800" cy="180" r="60" fill="#fbbf24"/>
    <circle cx="3400" cy="100" r="30" fill="#fbbf24"/>
  </g>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>